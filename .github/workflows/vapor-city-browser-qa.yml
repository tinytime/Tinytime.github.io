name: Vapor City Browser QA

permissions:
  contents: read

concurrency:
  group: npc-browser-qa-${{ github.ref }}
  cancel-in-progress: true

'on':
  workflow_dispatch:
  push:
    branches:
      - npc-granny-baseline-overhaul
      - main
    paths:
      - 'VaporCity_HD2D_Hybrid_Test.html'
      - 'npc_sprites.js'
      - 'qa/**'
      - 'project-background/qa-artifacts/fourth-civilian-batch/**'
      - '.github/workflows/vapor-city-browser-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build fourth-batch design-source projections and roster face crops
        if: always()
        run: node qa/build-fourth-batch-design-evidence.mjs
      - name: Validate semantic civilian proportion measurements and annotation manifest
        run: |
          node qa/test-civilian-proportion-measurements.mjs
          node qa/test-granny-mask-fit.mjs
          node qa/civilian-proportion-measurements.mjs --check
      - name: Run game browser diagnostics
        run: node qa/vapor-city-browser-qa.mjs
      - name: Build Granny four-direction semantic capture and overlay
        if: always()
        run: node qa/build-granny-semantic-overlay.mjs
      - name: Build six-civilian semantic annotation overlay
        if: always()
        run: node qa/build-civilian-annotation-overlay.mjs
      - name: Build five-civilian review sheet and summary
        if: always()
        run: node qa/build-five-civilian-review-sheet.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vapor-city-browser-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
