name: Vapor City Browser QA

'on':
  workflow_dispatch:
  push:
    branches:
      - npc-granny-baseline-overhaul
      - main
    paths:
      - 'VaporCity_HD2D_Hybrid_Test.html'
      - 'qa/**'
      - '.github/workflows/vapor-city-browser-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run game browser diagnostics
        run: node qa/vapor-city-browser-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vapor-city-browser-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
