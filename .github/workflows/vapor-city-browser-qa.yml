name: Vapor City Browser QA

permissions:
  contents: write

concurrency:
  group: npc-browser-qa-${{ github.ref }}
  cancel-in-progress: true

'on':
  workflow_dispatch:
  push:
    branches:
      - npc-granny-baseline-overhaul
      - main
    paths:
      - 'VaporCity_HD2D_Hybrid_Test.html'
      - 'npc_sprites.js'
      - 'qa/**'
      - '.github/workflows/vapor-city-browser-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run game browser diagnostics
        run: node qa/vapor-city-browser-qa.mjs
      - name: Seed initial NPC golden snapshots
        if: success()
        run: |
          BRANCH_HEAD="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$BRANCH_HEAD" != "$(git rev-parse HEAD)" ]; then
            echo "Skipping golden seed from stale workflow commit"
            exit 0
          fi
          if [ ! -d qa/golden-npcs ] || [ -z "$(find qa/golden-npcs -maxdepth 1 -name '*.png' -print -quit)" ]; then
            mkdir -p qa/golden-npcs
            cp qa-output/npc-snapshots/*.png qa/golden-npcs/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qa/golden-npcs
            git commit -m "Add initial NPC golden PNG snapshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            for file in qa-output/npc-snapshots/*.png; do
              cmp "$file" "qa/golden-npcs/$(basename "$file")"
            done
          fi
      - name: Verify seeded NPC golden snapshots
        if: success()
        run: node qa/vapor-city-browser-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vapor-city-browser-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
