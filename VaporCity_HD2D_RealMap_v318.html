const shadowCanvas=document.createElement('canvas');shadowCanvas.width=shadowCanvas.height=128;const shadowCtx=shadowCanvas.getContext('2d');const shadowGrad=shadowCtx.createRadialGradient(64,64,5,64,64,62);shadowGrad.addColorStop(0,'rgba(0,0,0,.58)');shadowGrad.addColorStop(.48,'rgba(0,0,0,.28)');shadowGrad.addColorStop(1,'rgba(0,0,0,0)');shadowCtx.fillStyle=shadowGrad;shadowCtx.fillRect(0,0,128,128);const shadowTex=new THREE.CanvasTexture(shadowCanvas);\nfunction blob(x,z,r=.42){const m=new THREE.Mesh(new THREE.CircleGeometry(r,28),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,opacity:.9,depthWrite:false}));m.rotation.x=-Math.PI/2;m.scale.y=.62;m.position.set(x,.022,z);S.add(m)}

const glowM=(c,i=3)=>new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i)});\nfunction streetBuild(){\n  // Raised, tiled sidewalks flank the central avenue; thin curb caps make the road edge readable.\n  const walkMat=std(0x29283d,{roughness:.94,metalness:.02}),curbMat=std(0x68718a,{roughness:.72,metalness:.12});\n  for(const side of [-1,1]){\n    box(1.65,.13,39.5,walkMat,side*3.05,0,0,false);\n    box(.16,.19,39.5,curbMat,side*2.18,0,0,false);\n    for(let z=-18;z<19;z+=2){box(1.5,.012,.035,std(0x45435e,{roughness:1}),side*3.05,.14,z,false)}\n  }\n  // Crosswalk at the central intersection, with raised corner landings.\n  for(let i=0;i<7;i++){const z=1.05+i*.34;box(3.55,.018,.19,std(0xb9c5d5,{roughness:.85}),0,.025,z,false)}\n  for(const x of [-2.85,2.85]){box(.95,.14,1.35,walkMat,x,0,1.45,false);box(.95,.025,1.35,std(0x44445f,{roughness:1}),x,.15,1.45,false)}\n  // Two compact hazard barriers echo the original Vapor City street dressing.\n  for(const x of [-1.45,1.45]){\n    box(1.05,.13,.13,std(0x292b3c,{metalness:.35}),x,.18,3.55);\n    box(.92,.28,.09,std(0xf0a83c,{roughness:.65}),x,.36,3.55);\n    for(let k=-1;k<=1;k++){const stripe=box(.13,.29,.105,std(0x25283b,{roughness:.8}),x+k*.28,.36,3.49,false);stripe.rotation.z=-.35}\n  }\n  // Manholes and drain grates give the road a readable surface at phone scale.\n  for(const [x,z] of [[-.95,5.8],[.9,-1.8],[-.8,-11],[.95,13]]){\n    const ring=new THREE.Mesh(new THREE.RingGeometry(.22,.29,24),std(0x687087,{metalness:.55,roughness:.55}));ring.rotation.x=-Math.PI/2;ring.position.set(x,.025,z);S.add(ring);\n    const lid=new THREE.Mesh(new THREE.CircleGeometry(.22,24),std(0x202438,{metalness:.45,roughness:.75}));lid.rotation.x=-Math.PI/2;lid.position.set(x,.026,z);S.add(lid);\n    for(let k=-2;k<=2;k++){box(.025,.008,.27,std(0x687087,{metalness:.5}),x+k*.065,.03,z,false)}\n  }\n}

function build(){

  // Game tile (x,y) maps to world (x-16, y-20). The gameplay map itself is unchanged.

  const [gc,gg]=cv(1024,1280);gg.fillStyle='#0b111d';gg.fillRect(0,0,1024,1280);
  const P=32, tile=(x,y,col)=>{gg.fillStyle=col;gg.fillRect(x*P,y*P,P-1,P-1)};
