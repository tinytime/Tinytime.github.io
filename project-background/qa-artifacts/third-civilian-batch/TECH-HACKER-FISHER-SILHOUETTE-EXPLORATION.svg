<text x="40" y="48" class="h">TECH · HACKER · FISHER — SILHOUETTE CORRECTION ROUND 02</text>
<text x="40" y="76" class="sub">Black construction only · deliberately different body geometry · front / back / left profile / right profile · not renderer output or approval</text>
<text x="40" y="101" class="sub">Side labels are character-relative. Front: character-left = viewer-right. Back: character-left = viewer-left. Profiles: near/far follow facing direction.</text>
<line x1="40" y1="120" x2="1560" y2="120" stroke="#aaa"/>
<!-- TECH: forward pitched wedge, narrow waist, staggered bent legs -->
<text x="40" y="158" class="name">01 · TECH — forward-loaded, narrow-waisted maintenance mechanic</text>
<g transform="translate(70 178)"><rect width="64" height="96" class="panel"/><path class="sil" d="M25 9 Q35 3 42 12 L39 21 29 22 23 17Z M24 23 L17 27 13 40 18 44 23 37 25 47 20 61 25 65 32 58 35 48 39 49 42 63 49 65 52 60 47 44 48 30 41 24 34 22 29 25Z M23 62 L32 63 30 76 24 87 15 88 13 83 19 72Z M40 62 L48 61 49 73 55 82 52 88 41 87 36 76Z M14 84 L26 84 25 91 10 91Z M45 83 L55 82 60 89 59 92 43 91Z M12 34 L17 31 21 37 19 48 14 50 10 45Z M8 48 L17 46 18 55 11 58 6 54Z"/><text x="32" y="118" text-anchor="middle" class="dir">FRONT</text></g><g transform="translate(245 178)"><rect width="64" height="96" class="panel"/><path class="sil" d="M25 9 Q35 3 42 12 L39 21 29 22 23 17Z M24 23 L17 27 13 40 18 44 23 37 25 47 20 61 25 65 32 58 35 48 39 49 42 63 49 65 52 60 47 44 48 30 41 24 34 22 29 25Z M23 62 L32 63 30 76 24 87 15 88 13 83 19 72Z M40 62 L48 61 49 73 55 82 52 88 41 87 36 76Z M14 84 L26 84 25 91 10 91Z M45 83 L55 82 60 89 59 92 43 91Z"/> <path d="M22 28 L42 49 L30 58 M43 28 L26 48 L37 58" fill="none" stroke="#f3f1eb" stroke-width="2.5"/><text x="32" y="118" text-anchor="middle" class="dir">BACK</text></g><g transform="translate(420 178)"><rect width="64" height="96" class="panel"/><path class="sil" d="M28 8 Q38 4 42 14 L39 21 29 22 24 16Z M27 22 L20 28 18 41 22 45 26 38 27 50 22 63 28 66 36 58 38 48 43 47 47 61 54 62 56 57 50 42 49 30 42 23 34 22Z M26 63 L36 64 32 77 26 88 18 88 16 83 22 73Z M44 61 L53 60 57 73 62 82 59 88 47 87 40 76Z M17 84 L28 84 27 91 13 91Z M51 83 L61 82 63 89 62 92 48 91Z"/><text x="32" y="118" text-anchor="middle" class="dir">LEFT PROFILE</text></g><g transform="translate(595 178)"><rect width="64" height="96" class="panel"/><path class="sil" d="M29 8 Q39 4 43 14 L40 21 30 22 25 16Z M28 22 L21 28 19 41 23 45 27 38 28 50 23 63 29 66 37 58 39 48 44 47 48 61 55 62 57 57 51 42 50 30 43 23 35 22Z M27 63 L37 64 33 77 27 88 19 88 17 83 23 73Z M45 61 L54 60 58 73 63 82 60 88 48 87 41 76Z M18 84 L29 84 28 91 14 91Z M52 83 L62 82 63 89 63 92 49 91Z"/><text x="32" y="118" text-anchor="middle" class="dir">RIGHT PROFILE</text></g>
<text x="790" y="195" class="note">Body: pitched upper body, tight waist, one flexed knee; no broad trouser wedges</text>
<text x="790" y="220" class="note">Garment: short close-cut field shell; offset harness with clear rear X; split utility tail</text>
<text x="790" y="245" class="note">Head: swept-back undercut + compact ear cup; no brim, visor or projecting bill</text>
<text x="790" y="270" class="note">Prop: diagnostic meter in character-left hand; front prop appears viewer-right</text>
<text x="790" y="295" class="note">Profile continuity: lean and tool arm remain readable; harness is not a head/visor cue</text>
<line x1="40" y1="330" x2="1560" y2="330" stroke="#aaa"/>
<!-- HACKER: narrow column, one drape wing, tapered legs -->
<text x="40" y="368" class="name">02 · HACKER — narrow folded column with one-sided drape</text>
<g transform="translate(70 388)"><rect width="64" height="96" class="panel"/><path class="sil" d="M27 8 Q35 2 42 11 L38 19 29 20 24 15Z M25 21 L20 26 19 39 23 43 27 36 28 48 25 62 30 65 35 55 37 47 40 48 42 62 47 64 50 60 46 43 46 29 40 22 33 20Z M28 62 L36 63 35 77 32 89 25 90 22 85 27 74Z M40 62 L47 63 48 77 51 89 44 90 39 80Z M23 87 L33 87 33 92 21 92Z M43 87 L52 87 55 92 42 92Z M18 24 L10 34 9 58 14 66 20 60 21 42 26 33Z M39 34 L45 40 46 51 41 55 37 47Z M5 54 L14 53 15 61 8 64 4 60Z"/><text x="32" y="118" text-anchor="middle" class="dir">FRONT</text></g><g transform="translate(245 388)"><rect width="64" height="96" class="panel"/><path class="sil" d="M27 8 Q35 2 42 11 L38 19 29 20 24 15Z M25 21 L20 26 19 39 23 43 27 36 28 48 25 62 30 65 35 55 37 47 40 48 42 62 47 64 50 60 46 43 46 29 40 22 33 20Z M28 62 L36 63 35 77 32 89 25 90 22 85 27 74Z M40 62 L47 63 48 77 51 89 44 90 39 80Z M23 87 L33 87 33 92 21 92Z M43 87 L52 87 55 92 42 92Z M19 25 L11 34 10 58 14 67 21 61 22 42Z M40 28 L48 32 50 52 56 69 50 77 45 64 43 48Z"/><text x="32" y="118" text-anchor="middle" class="dir">BACK</text></g><g transform="translate(420 388)"><rect width="64" height="96" class="panel"/><path class="sil" d="M29 7 Q38 3 42 12 L39 19 30 20 25 15Z M27 21 L22 27 21 40 25 44 28 37 29 49 26 63 31 66 37 56 39 48 43 48 46 62 51 63 53 58 48 43 47 29 41 22 34 20Z M29 63 L38 64 36 78 33 89 26 90 24 85 29 74Z M43 62 L51 62 54 77 57 88 50 90 44 80Z M24 87 L34 87 34 92 22 92Z M49 87 L58 87 61 92 48 92Z M21 26 L14 35 13 59 18 67 24 61 25 43Z M43 29 L50 36 51 53 57 70 51 77 46 63Z"/><text x="32" y="118" text-anchor="middle" class="dir">LEFT PROFILE</text></g><g transform="translate(595 388)"><rect width="64" height="96" class="panel"/><path class="sil" d="M30 7 Q39 3 43 12 L40 19 31 20 26 15Z M28 21 L23 27 22 40 26 44 29 37 30 49 27 63 32 66 38 56 40 48 44 48 47 62 52 63 54 58 49 43 48 29 42 22 35 20Z M30 63 L39 64 37 78 34 89 27 90 25 85 30 74Z M44 62 L52 62 55 77 58 88 51 90 45 80Z M25 87 L35 87 35 92 23 92Z M50 87 L59 87 62 92 49 92Z"/><text x="32" y="118" text-anchor="middle" class="dir">RIGHT PROFILE</text></g>
<text x="790" y="405" class="note">Body: narrowest shoulder/hip envelope; close-set tapered legs, inward elbows, no flared boots</text>
<text x="790" y="430" class="note">Garment: cropped asymmetric shell; one long panel on character-right only</text>
<text x="790" y="455" class="note">Head: side-swept fringe close to skull; exposed temple; no rear tail or neck flap</text>
<text x="790" y="480" class="note">Prop: slate in character-right hand; front prop appears viewer-left</text>
<text x="790" y="505" class="note">Back: drape panel only; no crossed straps, harness or X-shaped construction</text>
<line x1="40" y1="540" x2="1560" y2="540" stroke="#aaa"/>
<!-- FISHER: wide stance, long flared smock, broad boots -->
<text x="40" y="578" class="name">03 · FISHER — widest base, long weatherproof smock and deck stance</text>
<g transform="translate(70 598)"><rect width="64" height="96" class="panel"/><path class="sil" d="M17 11 Q27 3 43 9 L49 19 45 27 18 27 12 20Z M18 26 L8 34 5 52 12 58 18 46 20 58 12 76 9 84 22 88 31 78 33 61 40 61 44 79 55 88 63 83 58 69 51 51 50 34 43 27 32 26 25 30Z M18 75 L32 78 27 91 14 94 4 91 6 85Z M40 76 L55 75 61 87 63 94 48 95 39 88Z M3 89 L23 89 22 96 1 96Z M47 89 L63 88 63 96 45 96Z M5 43 L12 40 16 50 13 61 6 61 2 54Z M0 59 L13 57 16 69 10 76 2 72Z"/><text x="32" y="118" text-anchor="middle" class="dir">FRONT</text></g><g transform="translate(245 598)"><rect width="64" height="96" class="panel"/><path class="sil" d="M17 11 Q27 3 43 9 L49 19 45 27 18 27 12 20Z M18 26 L8 34 5 52 12 58 18 46 20 58 12 76 9 84 22 88 31 78 33 61 40 61 44 79 55 88 63 83 58 69 51 51 50 34 43 27 32 26 25 30Z M18 75 L32 78 27 91 14 94 4 91 6 85Z M40 76 L55 75 61 87 63 94 48 95 39 88Z M3 89 L23 89 22 96 1 96Z M47 89 L63 88 63 96 45 96Z M13 30 L52 30 57 49 48 56 17 56 7 48Z M30 55 L35 55 34 78 29 78Z"/><text x="32" y="118" text-anchor="middle" class="dir">BACK</text></g><g transform="translate(420 598)"><rect width="64" height="96" class="panel"/><path class="sil" d="M24 7 Q36 2 44 13 L43 24 34 29 22 24 18 15Z M22 27 L14 34 12 51 17 57 22 46 24 60 17 77 15 85 28 88 38 77 39 61 45 60 49 78 59 85 63 79 57 62 54 39 46 28 35 26Z M23 77 L38 78 34 91 20 95 10 91 13 85Z M45 77 L58 76 63 89 63 96 47 95 40 87Z M10 89 L30 89 29 96 7 96Z M48 89 L63 88 63 96 45 96Z M17 15 L9 21 15 32 24 28Z"/><text x="32" y="118" text-anchor="middle" class="dir">LEFT PROFILE</text></g><g transform="translate(595 598)"><rect width="64" height="96" class="panel"/><path class="sil" d="M25 7 Q37 2 45 13 L44 24 35 29 23 24 19 15Z M23 27 L15 34 13 51 18 57 23 46 25 60 18 77 16 85 29 88 39 77 40 61 46 60 50 78 60 85 63 79 58 62 55 39 47 28 36 26Z M24 77 L39 78 35 91 21 95 11 91 14 85Z M46 77 L59 76 63 89 63 96 48 95 41 87Z M11 89 L31 89 30 96 8 96Z M49 89 L63 88 63 96 46 96Z M40 54 L49 51 56 59 55 70 47 74 41 66Z"/><text x="32" y="118" text-anchor="middle" class="dir">RIGHT PROFILE</text></g>
<text x="790" y="615" class="note">Body: widest stance and base by a clear margin; outward-set legs, heavy broad deck boots</text>
<text x="790" y="640" class="note">Garment: long flared oilskin smock to upper thigh; broad shoulders, split lower hem</text>
<text x="790" y="665" class="note">Head: low close hood with short brow lip; neck flap belongs to garment, not hair mass</text>
<text x="790" y="690" class="note">Prop: net basket in character-left hand; front prop appears viewer-right</text>
<text x="790" y="715" class="note">Palette direction for later: weathered ochre / rust oilskin, not another blue-green</text>
<line x1="40" y1="750" x2="1560" y2="750" stroke="#aaa"/>
<text x="40" y="790" class="name">CORRECTION CHECKLIST — BEFORE OWNER REVIEW</text>
<text x="60" y="830" class="note">• Fisher widest base + longest smock; Tech forward lean + narrow waist; Hacker narrowest body + one-sided hanging panel.</text>
<text x="60" y="860" class="note">• No shared trouser/boot wedges or interchangeable profile columns. Reassess garment volume and leg geometry before detail.</text>
<text x="60" y="890" class="note">• Handedness is printed per view. Verify every visible prop follows shoulder → arm → hand → grip and character-relative side.</text>
<text x="60" y="920" class="note">• Hacker back has no X/harness. Tech back has an unmistakable crossing harness. Tech head has no brim/visor.</text>
<text x="60" y="950" class="note">• Hacker fringe ends at skull; Fisher's rear neck flap is garment-attached. These must not share a tail silhouette.</text>
<text x="60" y="980" class="note">• Palette after silhouette acceptance: Hacker charcoal / cool lilac / slate-blue accent; Fisher weathered ochre / rust oilskin.</text>
<text x="60" y="1010" class="note">• These are construction studies, not 64×96 renderer captures, not 28×42 evidence and not approved final art.</text>
<text x="40" y="1140" class="tiny">VAPOR CITY · CIVILIAN VECTOR OVERHAUL · CORRECTION ROUND 02 · 2026-11-20</text>
</svg>