h="1.5"/><text x="32" y="118" text-anchor="middle" class="dir">LEFT PROFILE</text></g><g transform="translate(595 598)"><rect width="64" height="96" class="panel"/><path class="sil" d="M28 9 Q36 5 43 13 L42 21 35 24 26 21 24 14Z M43 14 Q49 12 51 16 Q50 20 43 20Z M23 27 L15 34 13 51 18 57 23 46 25 60 18 77 16 85 29 88 39 77 40 61 46 60 50 78 60 85 63 79 58 62 55 39 47 28 36 26Z M24 77 L39 78 35 91 21 95 11 91 14 85Z M46 77 L59 76 63 89 63 96 48 95 41 87Z M11 89 L31 89 30 96 8 96Z M49 89 L63 88 63 96 46 96Z M40 54 L49 51 56 59 55 70 47 74 41 66Z"/><text x="32" y="118" text-anchor="middle" class="dir">RIGHT PROFILE</text></g>
<text x="790" y="615" class="note">Body: widest stance and base by a clear margin; outward-set legs, heavy broad deck boots</text>
<text x="790" y="640" class="note">Garment: long flared oilskin smock to upper thigh; broad shoulders, split lower hem</text>
<text x="790" y="665" class="note">Head: low close hood with short brow lip; neck flap belongs to garment, not hair mass</text>
<text x="790" y="690" class="note">Prop: net basket in character-left hand; front prop appears viewer-right</text>
<text x="790" y="715" class="note">Palette direction for later: weathered ochre / rust oilskin, not another blue-green</text>
<line x1="40" y1="750" x2="1560" y2="750" stroke="#aaa"/>
<text x="40" y="790" class="name">CORRECTION ROUND 04 — OWNER-REVIEW CANDIDATE</text>
<text x="60" y="830" class="note">• Fisher widest base + longest smock; Tech forward lean + narrow waist; Hacker narrowest body + one-sided hanging panel.</text>
<text x="60" y="860" class="note">• No shared trouser/boot wedges or interchangeable profile columns. Reassess garment volume and leg geometry before detail.</text>
<text x="60" y="890" class="note">• Tech/Fisher front and back studies are mirrored for character-left prop placement; front = viewer-right, back = viewer-left. Hacker slate = character-right; front = viewer-left, back = viewer-right.</text>
<text x="60" y="920" class="note">• Tech head cue (stepped undercut / ear-cup) must survive in all four views; Hacker broken fringe step remains distinct. Fisher has a compact matched hood in front/back and a short soft lip in both profiles.</text>
<text x="60" y="950" class="note">• Hacker fringe ends at skull; Fisher's rear neck flap is garment-attached. These must not share a tail silhouette.</text>
<text x="60" y="980" class="note">• Palette after silhouette acceptance: Hacker charcoal / cool lilac / slate-blue accent; Fisher weathered ochre / rust oilskin.</text>
<text x="60" y="1010" class="note">• Round 04: Fisher rear yoke is explicitly overpainted dark with a light seam; both profile hood lips are short and soft; rear hood is matched to front. Fisher basket and Tech meter appear in left profile only (character-left near side); Hacker character-right drape is hidden in left profile. Tech rear meter may remain occluded. These are construction studies, not renderer evidence or approval.</text>
<text x="40" y="1140" class="tiny">VAPOR CITY · CIVILIAN VECTOR OVERHAUL · CORRECTION ROUND 04 · 2026-11-20</text>
</svg>