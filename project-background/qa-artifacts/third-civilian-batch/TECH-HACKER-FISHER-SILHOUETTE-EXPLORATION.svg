<text x="40" y="862" class="name">OWNER PREFLIGHT — DECISIONS REQUIRED BEFORE RENDERER IMPLEMENTATION</text>
<text x="60" y="900" class="note">• Confirm or revise each silhouette's construction, head-read cue, garment logic, pose and role-defining interaction.</text>
<text x="60" y="930" class="note">• Confirm exactly three must-survive items, closest-face comparisons, prop side and near/far profile occlusion.</text>
<text x="60" y="960" class="note">• These panels are first-pass design silhouettes, not renderer output, not direct 28×42 captures, and not final approved art.</text>
<text x="60" y="990" class="note">• No renderer, existing civilian art, golden snapshot or baseline has been modified in this preflight.</text>
