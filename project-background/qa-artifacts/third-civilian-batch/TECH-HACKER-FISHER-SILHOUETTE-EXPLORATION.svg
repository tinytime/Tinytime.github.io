<title>Tech, Hacker and Fisher — silhouette correction round 04</title>
<desc>Rebuilt black silhouette studies with intentionally distinct body blocks, stances, garment volumes and explicit character-relative prop-side labels. Design exploration, not approved art or renderer output.</desc>
