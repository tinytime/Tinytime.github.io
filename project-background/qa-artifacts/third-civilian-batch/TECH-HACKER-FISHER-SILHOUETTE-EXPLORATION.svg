<text x="40" y="48" class="h">TECH · HACKER · FISHER — SILHOUETTE CORRECTION ROUND 04</text>
<text x="40" y="76" class="sub">Black construction only · deliberately different body geometry · front / back / left profile / right profile · not renderer output or approval</text>
<text x="40" y="101" class="sub">Explicit prop-side labels: Tech/Fisher character-left = front viewer-right, back viewer-left; Hacker character-right = front viewer-left, back viewer-right. Left profile shows character-left near-side; right profile shows character-right near-side. Far-side limbs/props are occluded.</text>
<line x1="40" y1="120" x2="1560" y2="120" stroke="#aaa"/>
<!-- TECH: forward pitched wedge, narrow waist, staggered bent legs -->
<text x="40" y="158" class="name">01 · TECH — forward-loaded mechanic · stepped undercut / ear-cup notch</text>
