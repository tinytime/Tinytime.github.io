 55 77 58 88 51 90 45 80Z M25 87 L35 87 35 92 23 92Z M50 87 L59 87 62 92 49 92Z"/><text x="32" y="118" text-anchor="middle" class="dir">RIGHT PROFILE</text></g>
<text x="790" y="405" class="note">Body: narrowest shoulder/hip envelope; close-set tapered legs, inward elbows, no flared boots</text>
<text x="790" y="430" class="note">Garment: cropped asymmetric shell; one long panel on character-right only</text>
<text x="790" y="455" class="note">Head: side-swept fringe close to skull; exposed temple; no rear tail or neck flap</text>
<text x="790" y="480" class="note">Prop: slate in character-right hand; front prop appears viewer-left</text>
<text x="790" y="505" class="note">Back: drape panel only; no crossed straps, harness or X-shaped construction</text>
