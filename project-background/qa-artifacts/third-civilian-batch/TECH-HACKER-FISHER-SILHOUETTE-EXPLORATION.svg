<text x="790" y="195" class="note">Body: pitched upper body, tight waist, one flexed knee; no broad trouser wedges</text>
<text x="790" y="220" class="note">Garment: short close-cut field shell; offset harness with clear rear X; split utility tail</text>
<text x="790" y="245" class="note">Head: swept-back undercut + compact ear cup; no brim, visor or projecting bill</text>
<text x="790" y="270" class="note">Prop: diagnostic meter in character-left hand; front prop appears viewer-right</text>
<text x="790" y="295" class="note">Profile continuity: lean and tool arm remain readable; harness is not a head/visor cue</text>
<line x1="40" y1="330" x2="1560" y2="330" stroke="#aaa"/>
<!-- HACKER: narrow column, one drape wing, tapered legs -->
<text x="40" y="368" class="name">02 · HACKER — narrow folded column · broken fringe notch / one-sided drape</text>
