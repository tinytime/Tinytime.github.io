<style>
.h{font:700 28px sans-serif;fill:#202124}.sub{font:15px sans-serif;fill:#555}.name{font:700 21px sans-serif;fill:#202124}.dir{font:700 13px sans-serif;fill:#555}.note{font:13px sans-serif;fill:#333}.tiny{font:12px sans-serif;fill:#555}.panel{fill:#e8e5dd;stroke:#c9c5bc;stroke-width:1.2}.sil{fill:#090a0d;stroke:#090a0d;stroke-linejoin:round;stroke-linecap:round}.cut{fill:#f3f1eb;stroke:#f3f1eb;stroke-linejoin:round}
