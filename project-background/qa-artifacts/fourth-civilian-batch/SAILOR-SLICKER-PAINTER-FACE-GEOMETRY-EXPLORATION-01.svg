<path class="face" d="M42 31 Q62 26 75 36 L77 48 L68 52 L65 63 L58 77 L47 81 L40 72 L43 61 L37 54 L28 50 L37 46 L38 37Z"/>
<path class="feature" d="M43 44 Q56 37 68 44 M43 49 L52 47 M41 53 L29 57 L35 60 M44 69 Q52 72 59 67"/>
<circle class="eye" cx="47" cy="51" r="2.2"/>
<text x="55" y="111" text-anchor="middle" class="s">PROFILE</text></g>
<text x="290" y="502" class="s">Closest roster faces selected from native 64×96 crops:</text><text x="290" y="524" class="n">Cook + Busker</text>
<text x="290" y="549" class="s">Cook: comparable midface width; Painter's jaw tapers more and nose bridge is longer.</text>
<text x="290" y="571" class="s">Busker: comparable open expression; Painter's brow is asymmetric and cheek plane sharper.</text>
<text x="290" y="593" class="s">Do not borrow Cook's moustache or Busker's youthful head proportions.</text>
