<path class="feature" d="M34 45 L47 43 L51 46 M57 43 L72 44 L75 47 M37 51 L47 51 M60 51 L69 51 M53 48 L52 60 L57 64 L52 68 M43 74 Q53 77 62 72"/>
<path class="feature" d="M31 40 Q51 35 76 40" stroke-width="4"/>
<circle class="eye" cx="43" cy="51" r="2.3"/><circle class="eye" cx="65" cy="51" r="2.3"/>
<text x="55" y="111" text-anchor="middle" class="s">FRONT</text></g>
<g transform="translate(155 118)"><rect width="110" height="120" class="panel"/>
<path class="hat" d="M32 17 Q51 0 75 16 L79 25 L35 25Z M25 25 L88 25 L90 31 L24 31Z"/>
