<circle class="eye" cx="43" cy="48" r="2.2"/><circle class="eye" cx="64" cy="49" r="2.2"/>
<text x="55" y="111" text-anchor="middle" class="s">FRONT</text></g>
<g transform="translate(155 300)"><rect width="110" height="120" class="panel"/>
<path class="hat" d="M16 18 L30 7 L74 7 L91 20 L85 29 L20 29Z"/>
<path class="face" d="M39 29 Q59 25 73 34 L76 46 L68 51 L64 61 L59 71 L49 76 L41 70 L43 61 L39 54 L27 51 L35 46 L35 36Z"/>
