<text x="30" y="38" class="h">FOURTH BATCH — FACE GEOMETRY EXPLORATION 01</text>
<text x="30" y="62" class="s">Neutral grayscale construction study · headwear is context only · compare face shape and feature geometry at matched crop scale · proposals, not approval</text>
<!-- Sailor -->
<text x="30" y="103" class="n">SAILOR #12 — defining cues: strong brow shelf + long hooked nose</text>
<g transform="translate(30 118)"><rect width="110" height="120" class="panel"/>
<path class="hat" d="M28 17 Q53 0 78 16 L81 26 L25 26Z M19 25 L88 25 L91 31 L17 31Z"/>
<path class="hair" d="M27 30 L34 30 L34 41 L28 43Z M76 30 L82 31 L81 42 L75 43Z"/>
