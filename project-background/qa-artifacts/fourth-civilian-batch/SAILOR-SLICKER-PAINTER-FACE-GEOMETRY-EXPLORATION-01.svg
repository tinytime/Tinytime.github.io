<circle class="eye" cx="46" cy="49" r="2.2"/>
<text x="55" y="111" text-anchor="middle" class="s">PROFILE</text></g>
<text x="290" y="320" class="s">Closest roster faces selected from native 64×96 crops:</text><text x="290" y="342" class="n">Hacker + Courier</text>
<text x="290" y="367" class="s">Hacker: comparable compact lower face and angled eye line; Slicker has a more tucked chin.</text>
<text x="290" y="389" class="s">Courier: comparable nose / cheek projection; Slicker's nose is shorter and the brow more acute.</text>
<text x="290" y="411" class="s">Do not borrow Hacker's fringe or Courier's cap.</text>
<!-- Painter -->
<text x="30" y="467" class="n">PAINTER #14 — defining cues: lifted asymmetric brow + long angular nose bridge</text>
