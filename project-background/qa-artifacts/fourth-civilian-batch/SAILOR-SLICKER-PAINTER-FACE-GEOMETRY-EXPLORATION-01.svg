<path class="feature" d="M43 44 Q55 40 66 44 M42 49 L51 48 M44 53 L50 53 M40 55 L29 58 L24 56 L30 53 M43 70 Q51 74 59 69"/>
<circle class="eye" cx="47" cy="52" r="2.2"/>
<text x="55" y="111" text-anchor="middle" class="s">PROFILE</text></g>
<text x="290" y="138" class="s">Closest roster faces selected from native 64×96 crops:</text><text x="290" y="160" class="n">Clinic + Guard</text>
<text x="290" y="185" class="s">Clinic: similar elongated profile / nose projection; Sailor's jaw is squarer and brow heavier.</text>
<text x="290" y="207" class="s">Guard: comparable brow shelf; Sailor's cheek taper and hooked nose are longer and more angular.</text>
<text x="290" y="229" class="s">Do not borrow Clinic's hairline or Guard's head silhouette.</text>
<!-- Slicker -->
<text x="30" y="285" class="n">SLICKER #13 — defining cues: angular brow/eye set + tucked chin / nose-cheek break</text>
<g transform="translate(30 300)"><rect width="110" height="120" class="panel"/>
<path class="hat" d="M17 18 L31 7 L73 7 L91 20 L84 29 L22 29Z"/>
<path class="face" d="M32 28 Q52 23 72 31 L75 48 L69 64 L63 75 L54 80 L41 75 L33 64 L29 48Z"/>
