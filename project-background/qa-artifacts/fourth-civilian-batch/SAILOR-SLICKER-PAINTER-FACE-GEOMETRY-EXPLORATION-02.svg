<text x="20" y="137" class="s">Sailor: strong brow shelf + long hooked profile nose. Closest roster face geometry: Clinic (elongated profile) and Guard (brow / jaw planes).</text>
<text x="20" y="161" class="s">Slicker: angular brow/eye set + tucked chin / nose-cheek break. Closest: Hacker (compact lower face / angled eye line) and Courier (nose / cheek projection).</text>
<text x="20" y="185" class="s">Painter: lifted asymmetric brow + long angular nose bridge. Closest: Cook (midface width) and Busker (open expression); Painter tapers more at jaw.</text>
<text x="20" y="209" class="s">All are design hypotheses; final face geometry remains owner-review material. Do not borrow comparator hairlines, headwear, facial hair or palettes.</text>
