<text x="760" y="230" class="small">Construction read</text>
<text x="760" y="258" class="small">• Narrow vertical torso; cropped squared coat</text>
<text x="760" y="282" class="small">• Raised split collar creates a distinct neck frame</text>
<text x="760" y="306" class="small">• Compact cap, no broad hood or long brim</text>
<text x="760" y="330" class="small">• Relaxed but planted stagger; arm/torso gaps retained</text>
<text x="760" y="354" class="small">• Profile nose/face geometry remains intentionally unresolved</text>
</g>
