<text x="40" y="76" class="sub">Upright narrow deckhand · squared cropped deck coat · raised collar · compact cap · character-left line-handling prop</text>
<text x="40" y="105" class="small">Study intent: the jacket/collar/cap and stance must identify the role before the optional mooring line is added.</text>
