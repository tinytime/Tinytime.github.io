<text x="760" y="490" class="small">Prop/contact notes</text>
<text x="760" y="518" class="small">• Coil remains compact and subordinate to the jacket silhouette</text>
<text x="760" y="542" class="small">• One wrist/hand contact chain; no floating line loop</text>
<text x="760" y="566" class="small">• Front/back side reverses with character orientation</text>
<text x="760" y="590" class="small">• Profiles: coil only on the side where character-left is near-side</text>
<text x="760" y="614" class="small">• Prop is optional; remove it if it muddies 28×42 readability</text>
<line x1="40" y1="665" x2="1320" y2="665" stroke="#aaa"/>
<text x="40" y="700" class="section">REVIEW GATES — NOT YET APPROVED</text>
<text x="60" y="730" class="small">1. Compare front/profile body-only and prop-on sheets against Clinic, Coach, Guard and Fisher at matched scale; pay particular attention to Clinic.</text>
<text x="60" y="754" class="small">2. Select the two closest existing face references only after inspecting actual head/jaw/brow/eye/nose geometry; headwear and colour do not count.</text>
<text x="60" y="778" class="small">3. Establish near/far arm anatomy first, then validate grip/contact in all four views. No palette or renderer work at this stage.</text>
<text x="40" y="824" class="tiny">VAPOR CITY · FOURTH CIVILIAN BATCH · SAILOR ONLY · STUDY 01 · 2026-11-20 · OWNER REVIEW REQUIRED</text>
