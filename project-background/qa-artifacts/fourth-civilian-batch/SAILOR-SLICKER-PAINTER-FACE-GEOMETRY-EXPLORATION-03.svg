<text class="note" x="20" y="132">Sailor: continuous brow shelf; longer, slightly hooked profile nose; lean cheek-to-chin transition.</text>
<text class="note" x="20" y="154">Slicker: closer-set eyes; compact level brow; tucked chin; compressed mouth.</text>
<text class="note" x="20" y="176">Painter: lifted asymmetric brow; squarer lower face and jaw turn; shorter, blunter profile nose.</text>
<text class="note" x="20" y="214">Exploratory grayscale proposal only — no final face, palette or renderer approval.</text>
</svg>
