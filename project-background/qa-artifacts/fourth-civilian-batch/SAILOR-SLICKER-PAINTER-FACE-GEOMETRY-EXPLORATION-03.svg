<text x="20" y="137" class="s">Sailor: strongest continuous brow shelf; profile nose projects farther with a slight downward hook and a leaner cheek-to-chin transition.</text>
<text x="20" y="161" class="s">Slicker: eye spacing tightened; nearly level compact brow, tucked chin and short compressed mouth. Face geometry, not hood shape, carries the distinction.</text>
<text x="20" y="185" class="s">Painter: lifted asymmetric brow retained; lower face squared with a flatter jaw turn and shorter, blunter profile nose.</text>
<text x="20" y="209" class="s">Exploratory proposal only. Face geometry is not owner-approved; palette, renderer integration and production art remain out of scope.</text>
</svg>