<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<title>Fourth civilian batch — face geometry exploration 03</title>
<desc>Six clean 40 by 38 face crops for Sailor, Slicker and Painter. Grayscale exploratory geometry, not final production faces.</desc>
<rect width="900" height="240" fill="#777982"/>
<style>
.label{font:700 11px sans-serif;fill:#fff}
.note{font:12px sans-serif;fill:#f5f5f5}
.facebg{fill:#e8e6e0;stroke:#c9c6bd;stroke-width:.7}
.skin{fill:#c9c5bd;stroke:#292a2c;stroke-width:1}
.cap{fill:#55585d;stroke:#25272a;stroke-width:1}
.hair{fill:#46484c;stroke:#25272a;stroke-width:1}
.line{fill:none;stroke:#17191c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.brow{fill:none;stroke:#17191c;stroke-width:2.4;stroke-linecap:round}
.eye{fill:#111}
</style>
<text class="label" x="20" y="18">SAILOR — FRONT</text>
<text class="label" x="75" y="18">SAILOR — PROFILE</text>
<text class="label" x="185" y="18">SLICKER — FRONT</text>
<text class="label" x="240" y="18">SLICKER — PROFILE</text>
<text class="label" x="350" y="18">PAINTER — FRONT</text>
<text class="label" x="405" y="18">PAINTER — PROFILE</text>

<!-- Every face occupies the exact 40x38 crop window expected by the QA capture. -->
