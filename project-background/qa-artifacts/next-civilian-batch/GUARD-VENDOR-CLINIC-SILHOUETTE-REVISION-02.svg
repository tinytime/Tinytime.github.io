<line x1="40" y1="844" x2="1560" y2="844" class="rule"/>
<text x="40" y="877" class="name">Directional verification key</text>
<text x="40" y="904" class="note">Each of the 12 silhouettes has its own path construction. Back views expose rear garment/helmet/hair geometry; profile views use side-on head, torso, arm and leg contours.</text>
<text x="40" y="929" class="note">Prop/gear visibility is intentionally directional: visible near-side contacts are drawn; far-side or rear occlusion is documented rather than falsely duplicated.</text>
<text x="40" y="954" class="note">Face studies are geometric construction prompts, not finished portraits. They show front and profile facial planes, eye spacing, brow, nose, jaw and hair/headwear differences.</text>
<text x="40" y="979" class="note">No 28×42 renderer captures are claimed. The separate matched-scale roster comparison remains the existing Revision 02 file and is preserved unchanged.</text>
<text x="40" y="1018" class="tiny">DESIGN-ONLY / NOT APPROVED · no renderer integration, production colour art, browser QA, QA baseline edits or golden snapshot changes.</text>
</svg>