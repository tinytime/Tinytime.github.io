<text x="40" y="48" class="h">GUARD · VENDOR · CLINIC WORKER — REVISION 02 / DIRECTIONAL CONSTRUCTION</text>
<text x="40" y="76" class="sub">Preserves the approved concept directions. Every directional silhouette below is separately drawn; no front-view group is reused or mirrored.</text>
<text x="40" y="98" class="sub">Black silhouettes are design studies on a shared 64×96 field. Face panels isolate front/profile geometry. No renderer, game code, production colour art or QA baseline is changed.</text>
